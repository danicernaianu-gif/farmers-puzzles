:root{
  /* Hawkstone Brand World v1: Harvest Gold, Bronze Gold, Dark Grey, Light Grey */
  --soil:#e5e4e3; --soil-2:#f1f0ee; --soil-3:#d7d5d1; --ink:#1a1b1c; --ink-dim:#625f5a; --rule:rgba(26,27,28,.16); --gold:#dfc08d; --gold-ink:#a97c58; --on-gold:#1a1b1c; --clay:#b06f45; --sage:#93a681; --sky:#86a1b1; --bad:#c4553a; --scrim:rgba(229,228,227,.9);
  --f:"Gellix","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){ --soil:#1a1b1c; --soil-2:#222425; --soil-3:#2d2f30; --ink:#f1efea; --ink-dim:#8f918e; --rule:rgba(241,239,234,.14); --gold:#dfc08d; --gold-ink:#dfc08d; --on-gold:#1a1b1c; --clay:#c98a5e; --sage:#9caf89; --sky:#8aa5b5; --bad:#e07a5f; --scrim:rgba(26,27,28,.86); color-scheme:dark }}
:root[data-theme="dark"]{ --soil:#1a1b1c; --soil-2:#222425; --soil-3:#2d2f30; --ink:#f1efea; --ink-dim:#8f918e; --rule:rgba(241,239,234,.14); --gold:#dfc08d; --gold-ink:#dfc08d; --on-gold:#1a1b1c; --clay:#c98a5e; --sage:#9caf89; --sky:#8aa5b5; --bad:#e07a5f; --scrim:rgba(26,27,28,.86); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--soil);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold-ink);outline-offset:2px}
.wrap{max-width:540px;margin:0 auto;padding-block:20px 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--rule)}
.top svg{height:18px;width:auto;display:block}
.tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
h1{font-size:clamp(40px,11vw,64px);line-height:.95;letter-spacing:-.02em;font-weight:500;margin:28px 0 10px;text-wrap:balance}
h2{font-size:26px;font-weight:500;letter-spacing:-.01em;margin:0;line-height:1.1}
p{margin:0}
.dim{color:var(--ink-dim)}
.day{display:flex;align-items:center;gap:10px;margin-top:6px}
.day button{width:28px;height:28px;border:1px solid var(--rule);border-radius:50%;color:var(--ink-dim)}
.day button:disabled{opacity:.3;cursor:default}
.mode{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:3px;margin-top:22px}
.mode button{padding:7px 14px;border-radius:999px;font-size:13px;color:var(--ink-dim)}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--soil)}
.games{display:grid;gap:10px;margin-top:22px}
.card{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;text-align:left;padding:14px;border:1px solid var(--rule);border-radius:14px;background:var(--soil-2);transition:border-color .15s}
.card:hover{border-color:var(--ink-dim)}
.card .ico{width:56px;height:56px;border-radius:10px;background:var(--soil-3);display:grid;place-items:center}
.card .ico svg{width:34px;height:34px}
.card h3{margin:0;font-size:20px;font-weight:500}
.card p{font-size:13px;color:var(--ink-dim);margin-top:2px}
.card .st{font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-dim);white-space:nowrap}
.card.done{border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.card.done .st{color:var(--gold-ink)}
.card.done .ico{background:color-mix(in srgb,var(--gold) 16%,var(--soil-3))}
.share{margin-top:14px;width:100%;padding:14px;border-radius:999px;background:var(--gold);color:var(--on-gold);font-size:15px}
.about{margin-top:40px;padding-top:22px;border-top:1px solid var(--rule);display:grid;gap:14px;font-size:14px;color:var(--ink-dim)}
.about strong{color:var(--ink);font-weight:500}
.bbf{display:block;width:100%;max-width:260px;height:auto;border-radius:0}
/* game screen */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.bar .back{font-size:14px;color:var(--ink-dim);display:flex;align-items:center;gap:6px}
.bar .clock{font-variant-numeric:tabular-nums;font-size:15px;min-width:44px;text-align:right}
.bar .help{width:28px;height:28px;border:1px solid var(--rule);border-radius:50%;font-size:13px;color:var(--ink-dim)}
.ghead{margin:20px 0 16px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.msg{min-height:22px;font-size:14px;color:var(--ink-dim);text-align:center;margin:12px 0 4px}
.msg.warn{color:var(--clay)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.btn{padding:11px 18px;border:1px solid var(--rule);border-radius:999px;font-size:14px}
.btn.main{background:var(--ink);color:var(--soil);border-color:var(--ink)}
.btn:disabled{opacity:.35;cursor:default}
/* stook */
.solved{display:grid;gap:8px;margin-bottom:8px}
.grp{border-radius:10px;padding:12px;text-align:center;color:var(--on-gold);animation:pop .35s ease}
.grp b{display:block;font-weight:500;font-size:15px;text-transform:uppercase;letter-spacing:.06em}
.grp span{font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{aspect-ratio:1/0.82;border-radius:10px;background:var(--soil-3);font-size:clamp(11px,3.1vw,14px);letter-spacing:.03em;text-transform:uppercase;display:grid;place-items:center;padding:4px;text-align:center;line-height:1.1;overflow-wrap:anywhere;transition:transform .1s,background .15s}
.tile[aria-pressed="true"]{background:var(--ink);color:var(--soil)}
.tile.shake{animation:shake .35s}
.tile.known{box-shadow:inset 0 0 0 1.5px var(--gold-ink)}
.tile.picking{outline:1px dashed var(--ink-dim);outline-offset:2px}
.notes{display:grid;gap:8px;margin-top:12px}
.notes p{font-size:14px;color:var(--ink-dim);padding:10px 12px;border-radius:10px;background:var(--soil-2);border:1px solid var(--rule)}
.notes b{color:var(--gold-ink);font-weight:500;margin-right:4px}
.lives{display:flex;gap:6px;justify-content:center;align-items:center;font-size:13px;color:var(--ink-dim);margin-top:14px}
.lives i{width:10px;height:10px;border-radius:50%;background:var(--ink);display:inline-block}
.lives i.gone{background:var(--soil-3)}
/* headland */
.meters{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--ink-dim);margin-bottom:10px;flex-wrap:wrap}
.tank{display:flex;gap:4px;align-items:center}
.tank i{width:12px;height:16px;border:1px solid var(--ink-dim);border-radius:3px;display:inline-block}
.tank i.on{background:var(--ink);border-color:var(--ink)}
.tank.full i.on{background:var(--clay);border-color:var(--clay)}
.board{width:100%;max-width:100%;touch-action:none;user-select:none;-webkit-user-select:none;display:block;border-radius:12px;background:var(--soil-2)}
.legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--ink-dim);margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
.legend svg{width:20px;height:20px}
.board.farm{background:#3c4a3e}
.lvl{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:2px}
.lvl button{padding:5px 11px;border-radius:999px;font-size:12px;color:var(--ink-dim)}
.lvl button[aria-pressed="true"]{background:var(--ink);color:var(--soil)}
/* rotation */
.rt{width:100%;border-collapse:separate;border-spacing:5px;table-layout:fixed}
.rt th{font-weight:400;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);padding:2px}
.rt th.f{text-align:left;font-size:12px;letter-spacing:.02em;text-transform:none;width:26%}
.rt td{padding:0}
.cell{width:100%;aspect-ratio:1;border-radius:9px;background:transparent;border:1px dashed var(--rule);font-size:clamp(15px,4.6vw,22px);display:grid;place-items:center;transition:background .15s}
.cell.given{background:var(--soil-3);border:1px solid var(--soil-3);color:var(--ink-dim)}
.cell.set{background:var(--ink);border-color:var(--ink);color:var(--soil)}
.cell.hinted{border-color:var(--gold-ink);color:var(--gold-ink)}
.cell.bad{box-shadow:inset 0 0 0 2px var(--bad)}
.rt.win .cell{box-shadow:0 0 0 2px var(--gold-ink)}
.cell.crop svg{width:62%;height:62%}
.cell.crop.given::after{content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.55}
.cell.crop{position:relative}
.cell.crop.hinted{outline:2px dashed var(--ink);outline-offset:-4px}
.cell.crop.set,.cell.crop.given{border-style:solid}
.pal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:14px}
.pal button{border:1px solid var(--rule);border-radius:10px;padding:7px 2px;display:grid;gap:4px;justify-items:center}
.pal .sw{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--cb);color:var(--cf)}
.pal b{font-weight:500;font-size:19px}
.pal span{font-size:11px;color:var(--ink-dim)}
.pal button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.pal button[aria-pressed="true"]>span:last-child{color:var(--ink)}
.pal .sw span{color:inherit}
.rules{margin:18px 0 0;padding:0;list-style:none;display:grid;gap:8px;font-size:14px}
.rules li{display:grid;grid-template-columns:22px 1fr;gap:8px;color:var(--ink-dim)}
.rules li b{color:var(--ink);font-weight:500}
.rules li i{font-style:normal;width:18px;height:18px;border-radius:50%;border:1px solid var(--rule);display:grid;place-items:center;font-size:11px;margin-top:1px}
.rules li.broke i{border-color:var(--bad);color:var(--bad)}
/* sheets */
.sheet{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:end center;z-index:10;padding:0 max(12px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(12px,env(safe-area-inset-left,0px))}
.sheet>div{width:100%;max-width:540px;background:var(--soil-2);border:1px solid var(--rule);border-radius:20px 20px 0 0;padding:26px 22px 28px;max-height:92vh;overflow:auto;animation:up .3s ease}
@media (min-width:700px){.sheet{place-items:center}.sheet>div{border-radius:20px}}
.sheet h2{margin-bottom:6px}
.big{font-size:44px;font-weight:500;color:var(--gold-ink);line-height:1;letter-spacing:-.02em}
.stats{display:flex;gap:24px;margin:16px 0 4px;font-variant-numeric:tabular-nums}
.stats div{display:grid}
.stats b{font-size:22px;font-weight:500}
.stats span{font-size:12px;color:var(--ink-dim);letter-spacing:.08em;text-transform:uppercase}
.note{margin-top:22px;padding-top:20px;border-top:1px solid var(--rule)}
.opts{display:grid;gap:8px;margin-top:14px}
.opts button{text-align:left;padding:12px 14px;border:1px solid var(--rule);border-radius:12px;font-size:15px}
.opts button.right{background:var(--gold);color:var(--on-gold);border-color:var(--gold-ink)}
.opts button.wrong{border-color:var(--bad);color:var(--bad)}
.opts button:disabled{cursor:default}
.fact{margin-top:12px;font-size:14px;color:var(--ink-dim)}
.edge{position:relative;aspect-ratio:4/5;width:100%;max-width:100%;border-radius:16px;background:#191b1c;overflow:hidden;touch-action:none}
.edge canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.over{position:absolute;inset:0;display:grid;place-items:center;background:var(--scrim);padding:24px;text-align:center}
.over>div{max-width:330px;display:grid;gap:12px;justify-items:center}
.over p{color:var(--ink-dim);font-size:15px}
.bigo{font-size:56px;color:var(--gold-ink);line-height:1;letter-spacing:-.02em}
.bigo.bad{color:var(--clay)}
.edge .over{background:rgba(25,27,28,.88);color:#fffaf0}
.edge .over p{color:#a9aaa6}.edge .over .tag{color:#a9aaa6}
.edge .over .btn{color:#fffaf0;border-color:rgba(255,250,240,.28)}
.edge .over .btn.main{background:#fffaf0;color:#191b1c;border-color:#fffaf0}
.edge .over .bigo{color:#dec08d}.edge .over .bigo.bad{color:#c98a5e}
.edge{width:min(100%,calc((100svh - 150px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * .8));margin-inline:auto}
.snd{font-size:13px;color:var(--ink-dim);padding:6px 12px;border:1px solid var(--rule);border-radius:999px}
.snd[aria-pressed="false"]{opacity:.6}
.turn{display:none}
@media (orientation:landscape) and (max-height:520px){.turn{display:grid;position:fixed;inset:0;z-index:20;place-items:center;background:#191b1c;color:#fffaf0;text-align:center;padding:24px}
 .turn>div{display:grid;gap:10px;justify-items:center}.turn svg{width:56px;height:56px;animation:tilt 1.6s ease-in-out infinite}.turn b{font-weight:500;font-size:20px}.turn span{color:#a9aaa6;font-size:14px}}
@keyframes tilt{0%,30%{transform:rotate(90deg)}60%,100%{transform:rotate(0)}}
@media (max-width:480px){.edge+.msg{display:none}#app .ghead{margin:12px 0 10px}#app .ghead h2{font-size:22px}}
/* On the Edge: Harvest Gold surround in both themes; the scene itself is always dark */
html:root.gold{--soil:#dec08d;--soil-2:#e6cda3;--soil-3:#d2b17b;--ink:#191b1c;--ink-dim:#4a4237;--rule:rgba(25,27,28,.22);--gold-ink:#191b1c;--clay:#7a4e2f;color-scheme:light}
html.gold body{background:#dec08d}
html.gold .pips i{border-color:#191b1c}html.gold .pips i.on{background:#191b1c;border-color:#191b1c}
html.gold .tune input{accent-color:#191b1c}
.tut{gap:10px!important}.tut .tv{width:min(200px,60%);height:auto;max-height:110px;margin:4px 0 2px}
.tut .dots{display:flex;gap:6px;margin-top:4px}.tut .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,250,240,.3);display:inline-block}.tut .dots i.on{background:#dec08d}
.edge .over h2{color:#fffaf0}
.tcard{position:absolute;left:3%;right:3%;top:2.5%;display:grid;gap:4px;padding:10px 12px;border-radius:14px;background:rgba(25,27,28,.94);border:1px solid rgba(255,250,240,.16);color:#fffaf0;z-index:2}
.tcard .tag{font-size:10px;color:#a9aaa6}
.tcard b{font-weight:500;font-size:clamp(15px,4.2vw,19px);line-height:1.15}
.tcard p{font-size:clamp(12px,3.3vw,14px);color:#c9c9c4;line-height:1.3}
.tcard .trow{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:4px}.tcard .trow .tag{margin-right:auto}
.tcard .tb{padding:7px 13px;border-radius:999px;border:1px solid rgba(255,250,240,.28);font-size:13px;color:#fffaf0}
.tcard .tb.main{background:#fffaf0;color:#191b1c;border-color:#fffaf0}
.pips.hl i{box-shadow:0 0 0 3px rgba(25,27,28,.25);animation:pp 1s ease-in-out infinite alternate}
@keyframes pp{to{transform:scale(1.25)}}
/* no text selection, copy menu, magnifier or tap flash while playing */
.edge,.edge *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html.gold body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html.gold .tune{-webkit-user-select:auto;user-select:auto}
.pips{display:flex;gap:6px}
.pips i{width:10px;height:10px;border-radius:50%;border:1px solid var(--ink-dim);display:inline-block}
.pips i.on{background:var(--gold);border-color:var(--gold-ink)}
.card.locked{opacity:.5;cursor:default}
.card.locked:hover{border-color:var(--rule)}
.blabel{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin:18px 0 -10px}
[hidden]{display:none!important}
/* logos: gold wordmark, ink text that follows the theme */
:root{--logo-gold:#ebc18b;--logo-ink:#191b1c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--logo-ink:#fffaf0}}
:root[data-theme="dark"]{--logo-ink:#fffaf0}
.top .hlogo{height:50px;width:auto;display:block;color:var(--logo-ink);flex:0 1 auto;min-width:0}
.wm .flogo{height:40px;width:auto;display:block;color:var(--logo-ink)}
.ver{font-size:12px;color:var(--ink-dim)}
.ver button,.lnk{text-decoration:underline;text-underline-offset:3px;color:var(--ink);font-size:12px}
.tip{font-size:13px;text-align:center;margin-top:10px}
/* week strip (Weekly) */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:16px}
.wk button{display:grid;justify-items:center;gap:2px;padding:8px 0 7px;border:1px solid var(--rule);border-radius:12px;color:var(--ink-dim)}
.wk button span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.wk button b{font-size:17px;font-weight:500;color:var(--ink)}
.wk button i{display:flex;gap:3px;margin-top:2px}
.wk button em{width:5px;height:5px;border-radius:50%;background:var(--soil-3)}
.wk button em.on{background:var(--gold-ink)}
.wk button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.wk button[aria-pressed="true"] b,.wk button[aria-pressed="true"] span{color:var(--soil)}
.wk button[aria-pressed="true"] em{background:rgba(127,127,127,.45)}.wk button[aria-pressed="true"] em.on{background:var(--gold)}
.wkl{font-size:13px;margin-top:8px}
/* chooser */
.choose .card{grid-template-columns:1fr auto}
/* Stook: groups to read once the game is over */
details.grp{text-align:left;padding:0}
details.grp summary{list-style:none;cursor:pointer;padding:12px 40px 12px 14px;position:relative;text-align:center}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary em{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-style:normal;font-size:20px;line-height:1;opacity:.7}
details.grp[open] summary em{transform:translateY(-50%) rotate(45deg)}
details.grp dl{margin:0;padding:0 14px 14px;display:grid;gap:8px;font-size:13.5px;line-height:1.35}
details.grp dt{font-weight:500;text-transform:uppercase;letter-spacing:.05em;font-size:12px}
details.grp dd{margin:0 0 4px;opacity:.9}
/* Rotation: darker givens, louder clashes */
.cell.crop.given{box-shadow:inset 0 0 0 2px rgba(0,0,0,.18)}
.cell.crop.given::after{background:#fffaf0;opacity:.8;width:6px;height:6px}
.cell.crop svg{position:relative;z-index:1}
.cell.crop.bad{box-shadow:0 0 0 3px var(--bad)}
.cell.crop.bad::before{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(135deg,rgba(196,85,58,.6) 0 4px,transparent 4px 9px)}
.cell.crop .bx{position:absolute;z-index:2;top:-7px;left:-7px;width:18px;height:18px;border-radius:50%;background:var(--bad);color:#fff;font-size:12px;line-height:18px;font-weight:500;text-align:center;box-shadow:0 0 0 2px var(--soil)}
.rules{gap:2px}.rules li{padding:6px 8px;border-radius:8px}
.rules li.broke{color:var(--ink);background:rgba(196,85,58,.13)}
.rules li.broke i{background:var(--bad);border-color:var(--bad);color:#fff}
/* feedback (Testing) */
.fbb{font-size:12px;padding:6px 11px;border:1px solid var(--gold-ink);border-radius:999px;color:var(--ink);background:var(--soil-2);display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.fbb i{font-style:normal;background:var(--gold);color:var(--on-gold);border-radius:999px;padding:0 6px;font-size:11px}
.fb{display:grid;gap:12px;margin-top:16px}
.fb label{display:grid;gap:5px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim)}
.fb select,.fb textarea,.fb input{font:inherit;font-size:16px;letter-spacing:0;text-transform:none;color:var(--ink);background:var(--soil);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;width:100%}
.fb textarea{resize:vertical;min-height:90px}
.fb a.btn{text-decoration:none;display:inline-block}
.fb a.btn.off{opacity:.4}
.fbl{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.fbl li{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;padding:9px 10px;border-radius:10px;background:var(--soil-3);font-size:14px}
.fbl small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:2px}
.fbl button{width:28px;height:28px;border-radius:50%;font-size:18px;color:var(--ink-dim)}
html.gold .fbb{background:transparent;border-color:rgba(25,27,28,.35)}
html.gold .fbb i{background:#191b1c;color:#dfc08d}
.tbadge{color:var(--on-gold);background:var(--gold);padding:3px 8px;border-radius:999px;letter-spacing:.1em}
.tools{margin-top:28px;padding:14px;border:1px dashed var(--rule);border-radius:14px;display:grid;gap:4px}
.tune{margin-top:16px;padding:14px;border:1px dashed var(--rule);border-radius:14px;font-size:14px}
.tune{border:0;padding:0}
.tune summary{cursor:pointer;font-weight:500;display:inline-flex;gap:6px;padding:10px 16px;border:1px solid var(--rule);border-radius:999px;list-style:none}
.tune summary::-webkit-details-marker{display:none}
.tune[open]{padding:14px;border:1px dashed var(--rule)}
.tune[open] summary{border-color:transparent;padding:0 0 4px}
.tune label{display:grid;grid-template-columns:1fr 1.2fr 44px;gap:10px;align-items:center;margin-top:12px;color:var(--ink-dim)}
.tune input{width:100%;accent-color:var(--gold-ink)}
.tune output{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.tune .btn{margin-top:10px}
.lockup{display:flex;align-items:center;gap:11px;color:var(--ink);min-width:0}
.lockup .mono{height:30px;width:auto;color:var(--gold-ink);flex:none}
.lk{display:grid;line-height:1.1;min-width:0}
.lk b{font-weight:500;font-size:19px;letter-spacing:-.01em}
.lk small{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);margin-top:3px}
.tr{display:flex;align-items:center;gap:10px;flex:none}
.theme{width:36px;height:36px;border-radius:50%;border:1px solid var(--rule);display:grid;place-items:center;color:var(--ink)}
.theme svg{width:18px;height:18px}
.theme:hover{border-color:var(--ink-dim)}
.stand{margin:18px 0 12px;font-size:clamp(13px,3.7vw,16px);line-height:1.3;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-wrap:balance}
.foot{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:6px}
.wm{color:var(--gold-ink)}
.wm svg{height:20px;width:auto;display:block}
.bbf{max-width:200px}
.howto ol{padding-left:20px;margin:12px 0 0;display:grid;gap:8px;color:var(--ink-dim)}
.howto ol b{color:var(--ink);font-weight:500}
.why{margin-top:14px;font-size:13px;color:var(--ink-dim);padding:12px;border-radius:10px;background:var(--soil-3)}
.why b{color:var(--gold-ink);font-weight:500}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- utilities ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,R){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=(R()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a}
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const LAUNCH=Date.UTC(2026,9,14);
const now=new Date();
const TODAY=Math.max(1,Math.round((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())-LAUNCH)/864e5)+1);
let day=TODAY;
const dateOf=n=>new Date(LAUNCH+(n-1)*864e5).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"});
let timed=store.get("tfp-timed",true);
const results=()=>store.get("tfp-day-"+day,{});
const saveResult=(g,r)=>{const all=results();all[g]=r;store.set("tfp-day-"+day,all)};

const GLOSS={"Calf": "A young cow or bull in its first year. Most arrive in spring.", "Lamb": "A sheep under a year old. Lambing season runs roughly February to April.", "Foal": "A young horse, up to a year old.", "Kid": "Yes, a child. On a farm it's a young goat.", "Baler": "Towed behind a tractor, it gathers cut hay or straw and packs it into bales.", "Drill": "Not the DIY kind. A farm drill sows seed in neat rows at a set depth.", "Harrow": "A school, yes. Also a frame of spikes or discs dragged over ploughed ground to break it up.", "Plough": "Turns the soil over before sowing. Also seven stars and a lot of pub signs.", "Texel": "An island off the Dutch coast, and the meaty white-faced breed that came from it.", "Suffolk": "A county, yes. Also a black-faced, black-legged breed that started there.", "Jacob": "A first name, and a piebald breed that can grow up to six horns.", "Cheviot": "Hills on the English and Scottish border, and the hardy white-faced animals that graze them.", "Skyfall": "A Bond film, and a name you'd find on a seed merchant's list. It ends up in bread.", "Extase": "French for ecstasy. Farmers know it as something drilled in autumn and combined the next summer.", "Crusoe": "Robinson, of course. On a farm it's sown in autumn and milled into flour.", "Graham": "A first name and a Scottish surname. On a seed list it's sown in autumn and harvested in August.", "Loam": "A balanced mix of sand, silt and clay. Every gardener's favourite.", "Clay": "Heavy, sticky and slow to drain, but rich in nutrients.", "Silt": "Fine particles left behind by rivers. Smooth, fertile and easily washed away.", "Chalk": "Pale, free-draining ground. The South Downs are made of it.", "Hedge": "Planted to keep stock in. Also home to birds, insects and blackberries.", "Ditch": "Dug along a boundary to drain water off the land.", "Stile": "Steps over a boundary that let walkers through but keep the sheep in.", "Gate": "Five bars is the classic farm version. Leave it as you found it.", "Dexter": "A TV detective, and the smallest native breed of its kind in Britain and Ireland, raised for milk and beef.", "Hereford": "A cathedral city, and the red beef breed with a white face that started there.", "Limousin": "Not the car. A region of France, and the golden-red beef breed named after it.", "Angus": "A first name, and a Scottish county that gave its name to a famous black beef breed.", "Maris Otter": "Not an animal. Bred in 1965 and still loved by brewers for its biscuity flavour.", "Laureate": "A poet's title. In a field, it's sown in spring and bought by maltsters.", "Planet": "Earth is one. This Planet is sown in spring and ends up in maltings across Europe.", "Golden Promise": "Sounds like a slogan. It's a Scottish variety famous in whisky and beer.", "Hay": "Grass cut and dried in the sun, then baled.", "Straw": "The dry stalks left after the grain is harvested. Mostly used for bedding.", "Silage": "Grass or maize packed airtight while still wet so it pickles. You'll smell it before you see it.", "Haylage": "Somewhere between hay and silage. Wilted, then wrapped in plastic.", "Sussex": "A county, and a classic hen, often white with black neck feathers.", "Orpington": "A town in Kent, and the big, fluffy breed of hen developed there.", "Leghorn": "The old English name for Livorno in Italy, and a hen that lays a lot of white eggs.", "Silkie": "Feathers like fur, black skin and five toes on each foot.", "Tamworth": "A Staffordshire town, and the ginger, long-snouted breed raised there.", "Berkshire": "A county, and a black breed with white socks and a white tail tip, prized for its pork.", "Duroc": "An American breed with a reddish coat, often used for crossbreeding.", "Saddleback": "Black with a white band over the shoulders, like a saddle.", "Clover": "Lucky with four leaves. Its roots put nitrogen back into the soil.", "Vetch": "A climbing plant with purple flowers, sown to feed the soil between cash crops.", "Phacelia": "Purple flo const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches};
(()=>{const t=store.get("tfp-theme",null);if(t)document.documentElement.dataset.theme=t})();
const themeBtn=()=>`<button class="theme" id="theme" aria-label="${isDark()?"Switch to light":"Switch to dark"}">${isDark()?SUN:MOON}</button>`;
function bindTheme(redraw){const b=$("#theme");if(b)b.onclick=()=>{const t=isDark()?"light":"dark";document.documentElement.dataset.theme=t;store.set("tfp-theme",t);redraw()}}
/* ---------- shell ---------- */
let clock=null,started=0,elapsed=0,current=null;
function startClock(){started=performance.now()-elapsed*1000;stopClock();clock=setInterval(()=>{elapsed=(performance.now()-started)/1000;const c=$(".clock");if(c)c.textContent=timed?fmt(elapsed):""},250)}
function stopClock(){if(clock)clearInterval(clock);clock=null}

function home(){
 document.documentElement.classList.remove("gold");edgeStop();stopClock();current=null;
 const r=results();
 const all=GAMES.every(g=>r[g.id]);
 $("#app").innerHTML=`
 <div class="top">${HEADLOGO}<span class="tr">${TESTING?'<span class="tbadge">Testing</span>':""}${fbBtn()}${themeBtn()}</span></div>
 <p class="stand">Fair warning: farmers have the edge here.</p>
 ${TESTING?`<div class="day"><button id="prev" aria-label="Previous day" ${day<=1?"disabled":""}>‹</button>
   <span class="dim">No. ${day} · ${dateOf(day)}</span>
   <button id="next" aria-label="Next day" ${day>=TODAY+6?"disabled":""}>›</button></div>`:weekStrip()}
 <div class="mode" role="group" aria-label="Play mode">
   <button id="m-t" aria-pressed="${timed}">Timed</button><button id="m-r" aria-pressed="${!timed}">Relaxed</button></div>
 <div class="games">${GAMES.map(g=>{const d=r[g.id];return `
   <button class="card ${d?"done":""}" data-g="${g.id}">
     <span class="ico">${ICON[g.id]}</span>
     <span><h3>${g.name}</h3><p>${g.line}</p></span>
     <span class="st">${d?(d.lost?"Lost":"✓ "+(d.time!=null?fmt(d.time):"Done")):"Play"}</span>
   </button>`}).join("")}</div>
 <p class="blabel">Bonus round</p>
 <div class="games">${(()=>{const un=all||BONUS_PREVIEW,e=r.edge;return `<button class="card ${un?"":"locked"} ${e&&e.won?"done":""}" id="bonus" ${un?"":'aria-disabled="true"'}>
   <span class="ico">${ICON.edge}</span><span><h3>On the Edge</h3><p>${un?"Someone pokes your pint. Save it three times.":"Finish all three puzzles to unlock."}</p></span>
   <span class="st">${e?(e.won?"✓ "+e.pct+"%":"Gone"):un?"Play":"Locked"}</span></button>`})()}</div>
 ${all?`<button class="share" id="share">Share today's harvest</button>`:""}
 ${TESTING?`<div class="tools"><span class="tag">Testing tools</span><div class="row" style="justify-content:flex-start"><button class="btn" id="tClear">Clear this day's results</button><button class="btn" id="tHow">Show how-to screens again</button></div></div>`:""}
 <section class="about">
   <p><strong>Three puzzles a day, grown in Britain.</strong> Every one is built from real farm knowledge, so farmers should finish faster. Anyone can still solve them by thinking it through. Finish a puzzle and answer a field note to take ten seconds off your time.</p>
   <p>New puzzles every morning. Played in the barn, at the bar or anywhere in between.</p>
   <div class="foot"><span class="wm">${FOOTLOGO}</span>${BADGE}</div>
   <p class="ver">${TESTING?"Testing version":"Weekly version, as players see it"} · <button id="swv">Switch</button></p>
 </section>`;
 bindTheme(home);
 if(TESTING){$("#prev").onclick=()=>{day--;home()};$("#next").onclick=()=>{day++;home()}}
 else document.querySelectorAll(".wk button").forEach(b=>b.onclick=()=>{day=+b.dataset.d;home()});
 const sv=$("#swv");if(sv)sv.onclick=chooser;
 $("#m-t").onclick=()=>{timed=true;store.set("tfp-timed",true);home()};
 $("#m-r").onclick=()=>{timed=false;store.set("tfp-timed",false);home()};
 document.querySelectorAll(".card").forEach(b=>b.onclick=()=>open(b.dataset.g));
 const sh=$("#share");if(sh)sh.onclick=()=>copyShare(sh);
 if(TESTING){$("#tClear").onclick=()=>{store.set("tfp-day-"+day,{});home()};$("#tHow").onclick=e=>{GAMES.forEach(g=>store.set("tfp-seen-"+g.id,false));e.target.textContent="Done"}}
 const bn=$("#bonus");bn.onclick=()=>{if(all||BONUS_PREVIEW)openBonus()};
}

function weekStrip(){
 const ws=Math.floor((day-1)/7)*7+1;
 return `<div class="wk" role="group" aria-label="This week">${Array.from({length:7},(_,k)=>{const d=ws+k,r=store.get("tfp-day-"+d,{}),n=GAMES.filter(g=>r[g.id]).length;
  const dt=new Date(LAUNCH+(d-1)*864e5);
  return `<button data-d="${d}" aria-pressed="${d===day}" aria-label="${dateOf(d)}, ${n} of 3 played"><span>${dt.toLocaleDateString("en-GB",{weekday:"short",timeZone:"UTC"})}</span><b>${dt.getUTCDate()}</b><i>${[0,1,2].map(j=>`<em class="${j<n?"on":""}"></em>`).join("")}</i></button>`}).join("")}</div>
 <p class="dim wkl">Week ${(ws-1)/7+1} · No. ${day}</p>`;
}

/* ---------- levels: Telly (easier) and Farmer (harder), chosen per game ---------- */
const LEVELS={telly:"Telly",farmer:"Farmer"};
const lvlOf=id=>store.get("tfp-lvl-"+id,"telly");
const LV={
 stook:{telly:{lives:6,know:6},farmer:{lives:4,know:3}},
 headland:{telly:{W:5,H:6,C:11,pond:[2,3],trees:[2,2]},farmer:{W:6,H:7,C:8,pond:[3,4],trees:[2,3]}},

/* ---------- Stook ---------- */
const STOOK_TONES=[{bg:"#bed3e5",fg:"#1a1b1c"},{bg:"#e0b1d2",fg:"#1a1b1c"},{bg:"#3c4a3e",fg:"#fffaf0"},{bg:"#dfc08d",fg:"#1a1b1c"}];
function Stook(root,prev){
 const lvl=prev?.level||lvlOf("stook"),L=Object.assign({},LV.stook[lvl],TESTING?{}:{know:Infinity});
 const P=STOOKS[(day-1)%STOOKS.length];
 const R=rng(day*7919+1);
 const words=shuffle(P.flatMap((g,i)=>g.w.map(w=>({w,g:i}))),R);
 let order=words.map(x=>x.w),sel=[],solved=[],mistakes=0,guesses=[],found=0,known=[],picking=false;
 if(prev){solved=[0,1,2,3];mistakes=prev.mistakes||0}
 const gOf=w=>words.find(x=>x.w===w).g;
 function draw(msg="",warn=false,shakeIt=false){
  const left=order.filter(w=>!solved.includes(gOf(w)));
  const over=!left.length;
  root.innerHTML=`${over?`<p class="tip dim" style="margin:0 0 10px">Tap a group to read about it.</p>`:""}<div class="solved">${solved.map(i=>over?`<details class="grp" style="background:${STOOK_TONES[i].bg};color:${STOOK_TONES[i].fg}"><summary><b>${esc(P[i].n)}</b><span>${P[i].w.map(esc).join(", ")}</span><em aria-hidden="true">+</em></summary><dl>${P[i].w.map(w=>`<dt>${esc(w)}</dt><dd>${esc(GLOSS[w]||"")}</dd>`).join("")}</dl></details>`:`<div class="grp" style="background:${STOOK_TONES[i].bg};color:${STOOK_TONES[i].fg}"><b>${esc(P[i].n)}</b><span>${P[i].w.map(esc).join(", ")}</span></div>`).join("")}</div>
   <div class="tiles">${left.map(w=>`<button class="tile ${shakeIt&&sel.includes(w)?"shake":""} ${known.includes(w)?"known":""} ${picking?"picking":""}" data-w="${esc(w)}" aria-pressed="${sel.includes(w)}">${esc(w)}</button>`).join("")}</div>
   ${known.length&&!over?`<div class="notes">${known.map(w=>`<p><b>${esc(w)}</b> ${esc(GLOSS[w]||"")}</p>`).join("")}</div>`:""}
   <p class="msg ${warn?"warn":""}">${msg}</p>
   ${left.length?`<div class="lives">Mistakes left ${Array.from({length:L.lives},(_,i)=>`<i class="${i<mistakes?"gone":""}"></i>`).join("")}</div>
   <div class="row"><button class="btn ${picking?"main":""}" id="hint" ${known.length>=L.know&&!picking?"disabled":""}>${picking?"Cancel":"Know more"+(isFinite(L.know)?" · "+(L.know-known.length):"")}</button><button class="btn" id="shuf">Shuffle</button><button class="btn" id="clr" ${sel.length?"":"disabled"}>Deselect</button><button class="btn main" id="sub" ${sel.length===4?"":"disabled"}>Submit</button></div>
   <div class="row"><button class="btn" id="sreset">Reset</button></div>`:""}`;
  root.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{const real=t.dataset.w;
    if(picking){picking=false;if(!known.includes(real))known.push(real);draw();return}
    if(sel.includes(real))sel=sel.filter(x=>x!==real);else if(sel.length<4)sel.push(real);draw()});
  const q=id=>root.querySelector(id);
  if(q("#hint"))q("#hint").onclick=hint;
  if(q("#sreset"))q("#sreset").onclick=()=>open("stook",true);
  if(q("#shuf")){q("#shuf").onclick=()=>{order=shuffle(order,Math.random);draw()};q("#clr").onclick=()=>{sel=[];draw()};q("#sub").onclick=submit}
 }
 function hint(){
  if(picking){picking=false;return draw()}
  if(known.length>=L.know)return;
  picking=true;draw("Tap the word you'd like to know more about.");
 }
 function submit(){
  const gs=sel.map(gOf);guesses.push(gs);
  const counts={};gs.forEach(g=>counts[g]=(counts[g]||0)+1);
  const top=Math.max(...Object.values(counts));
  if(top===4){solved.push(gs[0]);sel=[];
    if(solved.length===4){draw("Stooked.");done(false)}else draw()}
  else{mistakes++;
    if(mistakes>=L.lives){found=solved.length;solved=[...solved,...[0,1,2,3].filter(i=>!solved.includes(i))];sel=[];draw("The rain got there first.",true);done(true)}
    else draw(top===3?"One away.":"Not a group.",true,true)}
 }
 function done(lost){
  const em=["🟦","🟪","🟩","🟨"];
  finish("stook",{lost,level:lvl,mistakes,grid:guesses.map(r=>r.map(g=>em[g]).join("")).join("\n"),hints:known.length,stats:[["Mistakes",mistakes],["Know more",known.length],["Groups",(lost?found:4)+"/4"]]});
 }
 draw();
}

/* ---------- Headland ---------- */
function genField(seed,lvl="farmer"){
 const L=LV.headland[lvl],R=rng(seed),W=L.W,H=L.H,N=W*H;
 let p=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++)p.push(y*W+(y%2?W-1-x:x));
 const nb=c=>{const x=c%W,y=(c/W)|0,r=[];if(x>0)r.push(c-1);if(x<W-1)r.push(c+1);if(y>0)r.push(c-W);if(y<H-1)r.push(c+W);return r};
 for(let k=0;k<N*60;k++){
  if(R()<.5)p.reverse();
  const Ln=p.length,ns=nb(p[Ln-1]).filter(n=>n!==p[Ln-2]),n=ns[(R()*ns.length)|0],i=p.indexOf(n);
  p=p.slice(0,i+1).concat(p.slice(i+1).reverse());
 }
 const a=L.pond[0]+((R()*(L.pond[1]-L.pond[0]+1))|0),b=L.trees[0]+((R()*(L.trees[1]-L.trees[0]+1))|0);
 const pond=p.slice(0,a),trees=p.slice(p.length-b),path=p.slice(a,p.length-b);
 const C=L.C,tr=new Set();let t=1,lim=C-((R()*3)|0);
 for(let i=1;i<path.length;i++){t++;if(t>=lim&&i<path.length-1){tr.add(path[i]);t=0;lim=C-((R()*3)|0)}}
 return {W,H,C,nb,pond:new Set(pond),trees:new Set(trees),trailers:tr,start:path[0],crop:path.length,solution:path};
}

function Headland(root,prev){
 const lvl=prev?.level||lvlOf("headland");
 const F=genField(day*104729+3,lvl),{W,H,C}=F,S=10;
 let path=[F.start],restarts=0,hints=0,won=!!prev;
 if(prev)path=F.solution.slice();
 const tankOf=()=>{let t=0;path.forEach((c,i)=>{t=F.trailers.has(c)&&i>0?0:t+1});return t};
 const blocked=c=>F.pond.has(c)||F.trees.has(c);
 const canMove=c=>{if(blocked(c)||path.includes(c))return false;if(!F.nb(path[path.length-1]).includes(c))return false;return F.trailers.has(c)||tankOf()+1<=C};
